[project]
name = "qwen-token-gateway"
version = "1.0.0"
description = "OpenAI-compatible gateway that adapts user-provided Qwen credentials into a standard API, with a token pool, failover and an admin dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "httpx>=0.27,<1.0",
    "sqlalchemy>=2.0.30,<3.0",
    "aiosqlite>=0.20,<1.0",
    "cryptography>=43.0",
    "itsdangerous>=2.2,<3.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29,<1.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "openai>=1.40",
]

[project.scripts]
qwen-gateway = "app.main:run"
qwen-gateway-cli = "app.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "frontend", "data", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI's Depends() in defaults is idiomatic
    "S101",    # asserts are fine in tests
    "RUF012",  # mutable class attrs without ClassVar
    "N818",    # error-class naming
    "SIM108",  # ternaries are not always clearer
    "UP017",   # datetime.timezone.utc is clearer and works on every 3.x
    "UP042",   # str+Enum is intentional (JSON-serialisable event types)
    "RUF001",  # the mask character "•" is deliberate
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N", "B", "SIM", "ASYNC"]
"app/cli.py" = ["S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/__main__.py"]
